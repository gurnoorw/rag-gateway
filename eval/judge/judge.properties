# Answer judge settings for the t13 eval (D-24, D-53). Read by the eval harness, never by the gateway.
# Model id and list prices taken on 2026-11-17 from the Anthropic model table bundled with the claude-api reference
# (cached 2026-11-03): Claude Haiku 5.5, $0.10 / $0.50 per million input / output tokens for prompts up to 100K tokens
# ($0.50 / $2.50 above; judge prompts stay far below). Re-check before quoting costs.
model=claude-haiku-5-5
price.input-usd-per-mtok=0.10
price.output-usd-per-mtok=0.50
price.source=claude-api reference model table, cached 2026-11-03, read 2026-11-17
# No temperature, top_p or top_k: Claude Haiku 5.5 rejects non-default sampling parameters. Repeatability comes from
# a fixed prompt, a structured verdict and effort low; the calibration step measures agreement instead of assuming it.
effort=low
# Room for adaptive thinking plus a short JSON verdict; thinking counts toward max_tokens.
max-tokens=2048
# Hard spend cap per run in USD, enforced in code before every call (worst case of that call) and after it (reported
# usage). The owner may lower it on the command line, never raise it above this file without editing it.
cap-usd=0.50
# The key is read from this environment variable only (no fallback to other names, so the gateway's own key is
# never picked up by accident). Never put the key in this file.
api-key-env=EVAL_JUDGE_API_KEY
