# Owned by t04. Loads every dashboard JSON in ops/grafana/dashboards/ (mounted read-only at the path below).
# The JSON file is the source of truth: edits made in the Grafana UI are not saved back (allowUiUpdates false),
# so a dashboard change is a reviewed change to ops/grafana/dashboards/rag-gateway.json.
apiVersion: 1
providers:
  - name: rag-gateway
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
