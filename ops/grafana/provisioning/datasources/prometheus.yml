# Owned by t04. The dashboard's panels name this datasource by uid ("prometheus"); DashboardMetricsIT checks
# that the two agree.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s   # = scrape_interval in ops/prometheus/prometheus.yml
