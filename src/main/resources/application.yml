# rag-gateway configuration. Secrets come from the environment (.env, never committed).
# Feature sections are added by the task that owns them (docs/process/WORK_PLAN.md); defaults live in
# each feature's @ConfigurationProperties record, so this file only overrides.
spring:
  application:
    name: rag-gateway
  threads:
    virtual:
      enabled: true            # CLAUDE.md override; request handling on virtual threads (D-03)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raggateway}
    username: ${POSTGRES_USER:raggateway}
    password: ${POSTGRES_PASSWORD:raggateway}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000 # ms; a down database fails a log write fast instead of holding the thread (C7)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 50ms            # every Redis command; the limiter fails open past this (C24, D-17)
      connect-timeout: 500ms
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-connections: 10000     # open streams, not threads, are the limit with virtual threads (HLD deep dive 4)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"   # request id on every log line (G8)

gateway:
  # Load shedding (D-46): concurrent /v1 requests per instance before 503 overloaded. Measured on -Xmx512m in the
  # t08 run (2,000 streams completed at the heap limit, 4,000 ran out of heap); scale with -Xmx and re-measure.
  max-in-flight: 1500
  # Redis skip window (D-46): after a Redis failure, skip Redis (fail open) for this long before one probe.
  redis:
    skip-window: 1s
  default-max-tokens: 1024
  max-tokens-cap: 8192
  # Model catalog. Ids and list prices (USD per million tokens) taken on 2026-11-16 from the Anthropic
  # model table bundled with the claude-api reference (cached 2026-11-03). Re-check before quoting costs.
  # Keys with dots or colons need the [..] form.
  models:
    "[claude-opus-5-5]":
      provider: claude
      upstream-id: claude-opus-5-5
      input-usd-per-mtok: 4.00
      output-usd-per-mtok: 20.00
    "[claude-sonnet-5-5]":
      provider: claude
      upstream-id: claude-sonnet-5-5
      input-usd-per-mtok: 2.00
      output-usd-per-mtok: 10.00
    "[claude-haiku-5-5]":     # price valid for prompts up to 100K tokens (D-08)
      provider: claude
      upstream-id: claude-haiku-5-5
      input-usd-per-mtok: 0.10
      output-usd-per-mtok: 0.50
    "[llama3.2:1b]":           # local fallback, no list price
      provider: ollama
      upstream-id: "llama3.2:1b"
      input-usd-per-mtok: 0
      output-usd-per-mtok: 0
  # Model routing for "model":"auto" (t06, D-42). Rules in order, first match wins; a rule whose model the tenant
  # may not use is skipped; no match -> default-model (route rule "default"), or 403 model_not_allowed if the tenant
  # may not use it either. Conditions in "when" are optional and AND-ed: max-input-tokens / min-input-tokens
  # (estimated input, D-11), max-output-tokens (the request's max_tokens), has-schema. Every model must be in
  # gateway.models or startup fails. Rule names are lower-case identifiers (header, log row, metric label).
  # Tiers (D-08): cheap = claude-haiku-5-5, strong and default = claude-opus-5-5.
  routing:
    default-model: claude-opus-5-5
    rules:
      - name: short            # short prompt, small answer, no structured output -> cheap tier
        model: claude-haiku-5-5
        when:
          max-input-tokens: 2000
          max-output-tokens: 1024
          has-schema: false
  # Token bucket per tenant (t02): capacity = the tenant's tokens_per_minute; an empty bucket refills in
  # refill-period (1m keeps the long-run rate at exactly TPM). Budget and bucket state live in Redis.
  rate-limit:
    refill-period: 1m
  # Fallback router (t03, C20, D-07): the provider of the selected model first, then this chain. Per provider:
  # Retry(CircuitBreaker(call)); retry only before the first token, full-jitter backoff, Retry-After capped.
  fallback:
    chain:
      - provider: ollama
        model: "llama3.2:1b"
    max-attempts: 2
    backoff-base: 200ms
    backoff-cap: 2s
    retry-after-cap: 2s
    breaker:
      window: 20                 # count-based; also the minimum number of calls before it can open
      failure-rate-threshold: 50 # percent
      open-duration: 30s         # then one trial call (half-open)
  # Exact-match response cache (t05, C21, D-40): only temperature 0 without X-Gateway-Cache-Bypass is eligible;
  # entries are per tenant. A cold key is filled by one request holding a lock; the others poll every
  # poll-interval and call the provider themselves after lock-ttl. Redis errors read as a miss (fail open).
  cache:
    enabled: true
    ttl: 6h
    lock-ttl: 30s
    poll-interval: 50ms
  # Gateway-specific variable names (D-32): ANTHROPIC_BASE_URL / ANTHROPIC_API_KEY are also read by other
  # tools on the same machine, which could silently point the gateway at another host or account.
  providers:
    claude:
      base-url: ${GATEWAY_CLAUDE_BASE_URL:https://api.anthropic.com}
      api-key: ${GATEWAY_CLAUDE_API_KEY:}
      connect-timeout: 1s
      first-token-timeout: 5s
      idle-timeout: 30s
    ollama:
      base-url: ${GATEWAY_OLLAMA_BASE_URL:http://localhost:11434}
      connect-timeout: 1s
      first-token-timeout: 30s   # cold model load on the laptop
      idle-timeout: 30s
