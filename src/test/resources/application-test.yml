# Test profile. Datasource and Redis come from Testcontainers (support/AbstractIntegrationTest).
# A full-app test that does not register Redis gets this unresolvable host and fails loudly (D-35).
spring:
  data:
    redis:
      host: redis-not-configured-for-this-test.invalid
  # Every cached test context holds its own pool; 3 connections each keeps the suite well under Postgres's
  # connection limit (raised to 300 in SharedContainers) as the number of contexts grows (D-39).
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
# Provider base URLs are overridden per test to WireMock. No test reaches a real provider.
gateway:
  providers:
    claude:
      base-url: http://127.0.0.1:9    # unroutable on purpose; tests that need Claude set WireMock's URL
      api-key: test-key-not-secret
    ollama:
      base-url: http://127.0.0.1:9
  # RAG (t09, D-18, D-47): the fake embedder (Ollama is not reachable here), and no scheduled worker: every cached
  # context would poll the shared outbox and take other tests' jobs. Tests call IndexingWorker.pollOnce(); only
  # IngestionE2EIT turns the poller on.
  rag:
    embedder: fake
    worker:
      enabled: false
logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
